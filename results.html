<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أرشيف مقبرة السوق</title>

    <meta name="theme-color" content="#1565c0">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>أرشيف مقبرة السوق</h1>
</header>

<main class="container">

    <a href="index.html" class="backLink">&#8594; العودة إلى الصفحة الرئيسية</a>

    <section class="search-panel" id="searchPanel">

        <input
            type="text"
            id="searchInput"
            placeholder="اكتب الاسم أو جزءاً منه..."
            autocomplete="off" />

        <button id="searchBtn">
            بحث
        </button>

        <button id="clearBtn">
            مسح
        </button>

    </section>

    <section>
        <div id="status">
            اكتب اسماً للبحث
        </div>
    </section>

    <section>

        <table id="resultsTable">

            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>تاريخ الميلاد</th>
                    <th>تاريخ الوفاة</th>
                </tr>
            </thead>

            <tbody id="resultsBody">
            </tbody>

        </table>

        <div id="pagination" class="pagination hidden">

            <button id="prevPageBtn">
                &#8594; الصفحة السابقة
            </button>

            <span id="pageInfo"></span>

            <button id="nextPageBtn">
                الصفحة التالية &#8592;
            </button>

        </div>

    </section>

</main>

<!-- חלון פרטי אדם -->

<div id="detailsModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="closeBtn">
            &#10006;
        </button>

        <h2>البيانات الشخصية</h2>

        <div id="detailsContent">
        </div>

        <div class="modalButtons">
            <button id="copyBtn">
                نسخ التفاصيل
            </button>

            <button id="printBtn">
                اطبع
            </button>
        </div>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/results.js"></script>

</body>

</html>
