<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أرشيف مقبرة السوق</title>

    <meta name="theme-color" content="#1565c0">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>أرشيف مقبرة السوق</h1>
</header>

<main class="container home-container">
    <div class="hero-image">
        <img src="images/logo.png" alt="عائلة الفاهوم">
    </div>
    <section class="search-panel">

        <input
            type="text"
            id="searchInput"
            placeholder="اكتب الاسم أو جزءاً منه..."
            autocomplete="off" />

        <button id="searchBtn">
            بحث
        </button>

    </section>

    <p class="hint">اكتب اسماً وانقر على &quot;بحث&quot; للانتقال إلى قائمة النتائج.</p>

</main>

<script src="js/data.js"></script>
<script src="js/home.js"></script>

</body>

</html>
