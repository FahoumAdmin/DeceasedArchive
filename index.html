<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أرشيف المقبرة التحتى (السوق القديم)</title>

    <meta name="theme-color" content="#1565c0">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>أرشيف المقبرة التحتى (السوق القديم)</h1>
</header>

<main class="container home-container">
    <div class="hero-image">
        <img src="images/logo.png" alt="عائلة الفاهوم">
    </div>
    <section class="search-panel">

        <input
            type="text"
            id="searchInput"
            placeholder="اكتب الاسم أو جزءاً منه..."
            autocomplete="off" />

        <button id="searchBtn">
            بحث
        </button>

    </section>

    <p class="hint">اكتب اسماً وانقر على &quot;بحث&quot; للانتقال إلى قائمة النتائج.</p>

    <button id="oldestBurialsBtn" class="secondary-btn">
        أقدم 5 حالات دفن
    </button>

    <button id="newestBurialsBtn" class="secondary-btn">
        أحدث 5 حالات دفن
    </button>

    <button id="installBtn" class="install-btn" hidden>
        تثبيت التطبيق
    </button>

    <div id="iosInstallHint" class="ios-install-hint" hidden>
        <p>
            لتثبيت التطبيق على آيفون: اضغط على أيقونة المشاركة
            <span class="ios-share-icon" aria-hidden="true">⎋</span>
            في متصفح Safari، ثم اختر
            <strong>"إضافة إلى الشاشة الرئيسية"</strong>.
        </p>
        <button id="iosInstallCloseBtn" class="ios-install-close" aria-label="إغلاق">
            ×
        </button>
    </div>

</main>

<script src="js/data.js"></script>
<script src="js/home.js"></script>

</body>

</html>
